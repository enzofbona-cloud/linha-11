name: Web estável

# Push em main: testa, compila e publica em /stable/.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/build-web
        with:
          channel: stable

      - name: Publicar build em /stable/
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ${{ github.repository_owner }}/linha-11-web
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: stable
          commit_message: 'stable: ${{ github.sha }}'

      - name: Publicar página de testes
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ${{ github.repository_owner }}/linha-11-web
          publish_branch: gh-pages
          publish_dir: web/landing
          keep_files: true
          exclude_assets: 'app.test.mjs,package.json'
          commit_message: 'landing: ${{ github.sha }}'
