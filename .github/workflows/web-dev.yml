name: Web experimental

# Push em development: testa, compila e publica em /dev/.
# Push em ci-ensaio/**: testa e compila, mas NUNCA publica (usado para ensaios).
on:
  push:
    branches:
      - development
      - 'ci-ensaio/**'

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/build-web
        with:
          channel: dev

      # A publicação é sempre o último passo: qualquer falha acima mantém
      # no ar a última versão funcional.
      - name: Publicar build em /dev/
        if: github.ref == 'refs/heads/development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ${{ github.repository_owner }}/linha-11-web
          publish_branch: gh-pages
          publish_dir: build/web
          destination_dir: dev
          commit_message: 'dev: ${{ github.sha }}'

      - name: Publicar página de testes
        if: github.ref == 'refs/heads/development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ${{ github.repository_owner }}/linha-11-web
          publish_branch: gh-pages
          publish_dir: web/landing
          keep_files: true
          exclude_assets: 'app.test.mjs,package.json'
          commit_message: 'landing: ${{ github.sha }}'
