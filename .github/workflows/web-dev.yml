name: Web experimental

# Push em development: testa, compila e publica em /dev/.
# Push em ci-ensaio/**: testa e compila, mas NUNCA publica (usado para ensaios).
on:
  push:
    branches:
      - development
      - 'ci-ensaio/**'

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/build-web
        with:
          channel: dev

      # A publicação é sempre o último passo: qualquer falha acima mantém
      # Monta o site (landing na raiz + build na pasta do canal) e publica em
      # um único passo, sempre por último: qualquer falha acima mantém no ar a
      # última versão funcional. keep_files preserva a pasta do outro canal.
      - name: Montar site
        run: |
          mkdir -p build/site/dev
          cp web/landing/index.html web/landing/style.css web/landing/app.js build/site/
          cp -r build/web/. build/site/dev/

      - name: Publicar em /dev/
        if: github.ref == 'refs/heads/development'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEB_DEPLOY_KEY }}
          external_repository: ${{ github.repository_owner }}/linha-11-web
          publish_branch: gh-pages
          publish_dir: build/site
          keep_files: true
          commit_message: 'dev: ${{ github.sha }}'
